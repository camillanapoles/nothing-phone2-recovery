name: Proof

# Prova sem escape: contrato primeiro (falha em segundos), suíte inteira depois, mutação em
# fatias e um relatório que REPROVA se algum M[id] do catálogo não tiver sido executado.
# Por padrão valida TUDO (todos os mutantes). granularity=item roda um job por mutante
# (1 job por mutante ≈ 55 runner-min); o padrão (fatia) faz o mesmo em ~12 runner-min.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      granularity:
        description: "shard = fatias (~12 runner-min) · item = 1 job por M[id] (~55 runner-min)"
        type: choice
        options: [shard, item]
        default: shard
      shards:
        description: "número de fatias no modo shard (não é limite de cobertura: o total vem do catálogo)"
        type: string
        default: "8"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  contrato:
    name: Contrato + coerência (falha cedo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate do contrato (install-stack × consumidores)
        run: make -s stack
      - name: Coerência da refatoração (10/10)
        run: make -s refactor
      - name: Catálogo de mutação fechado (ids únicos, sem lacuna)
        run: make -s mutacao-verifica
      - name: Nenhum número escrito à mão (175→176 não pode passar despercebido)
        run: make -s contagens
      - name: Escopo, plano e continuidade
        run: |
          make -s escopo
          make -s closure
          make -s continuidade

  prove:
    name: Prova determinística (make -s prove)
    needs: contrato
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: make -s prove
        run: make -s prove

  plano:
    name: Plano da mutação (todos os M[id])
    needs: contrato
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slots: ${{ steps.split.outputs.slots }}
      total: ${{ steps.split.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        name: Fatiar o catálogo (nenhum id pode ficar de fora)
        env:
          SHARDS: ${{ github.event.inputs.shards || '8' }}
          GRANULARITY: ${{ github.event.inputs.granularity || 'shard' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          SK = "skills/evox-rom-ci-optimizer"
          cat = json.load(open(f"{SK}/references/mutation-catalog.json", encoding="utf-8"))
          ids = [m["id"] for m in cat["mutants"]]
          if len(ids) != len(set(ids)):
              print("::error::catálogo com ids duplicados", file=sys.stderr)
              sys.exit(1)
          if os.environ.get("GRANULARITY") == "item":
              slots = [{"slot": i, "label": i, "ids": i} for i in ids]
          else:
              n = max(1, min(int(os.environ.get("SHARDS", "8")), len(ids)))
              fatias = [f for f in (ids[i::n] for i in range(n)) if f]
              slots = [{"slot": f"s{k}", "label": f"shard {k}", "ids": ",".join(f)}
                       for k, f in enumerate(fatias)]
          # só a linha slots vai para $GITHUB_OUTPUT: comentário aqui quebra o parser
          print("slots=" + json.dumps(slots))
          print("total=" + str(len(ids)))
          print(f"{len(ids)} mutantes em {len(slots)} slot(s)", file=sys.stderr)
          PY

  mutacao:
    name: Mutação (${{ matrix.slot.label }})
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.plano.outputs.slots) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rodar o slot (id pedido fora do catálogo reprova aqui)
        run: |
          python3 skills/evox-rom-ci-optimizer/scripts/mutation_check.py --root . \
            --only "${{ matrix.slot.ids }}" --shard || true
      - name: Anotar sobrevivente/inválido/timeout (o log não é a prova)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = "workspace/audit/mutation.json"
          if not os.path.exists(p):
              print("::error::slot sem relatório de mutação")
              sys.exit(1)
          d = json.load(open(p, encoding="utf-8"))
          ruins = [r for r in d.get("results") or []
                   if r.get("status") in ("survived", "invalid", "timeout")]
          for r in ruins:
              print(f"::error file={r.get('file')}::" + r.get("id") + " " + r.get("status"))
          print(f"{d.get('killed')}/{d.get('total')} mortos neste slot")
          sys.exit(1 if ruins else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.slot.slot }}
          path: workspace/audit/mutation.json
          if-no-files-found: warn

  relatorio:
    name: Relatório item a item (reprova cobertura incompleta)
    needs: [plano, mutacao]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          path: slots
      - name: Consolidar, exigir TODOS os M[id] e publicar tabela
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, urllib.request

          SK = "skills/evox-rom-ci-optimizer"
          cat = json.load(open(f"{SK}/references/mutation-catalog.json", encoding="utf-8"))
          catalogo = [m["id"] for m in cat["mutants"]]
          arquivo = {m["id"]: m["file"] for m in cat["mutants"]}

          arqs = sorted(glob.glob("slots/*/mutation.json"))
          if not arqs:
              print("::error::nenhum slot produziu relatório de mutação")
              sys.exit(1)

          resultados, ruins, vistos = [], [], {}
          for a in arqs:
              d = json.load(open(a, encoding="utf-8"))
              for r in d.get("results") or []:
                  resultados.append(r)
                  vistos[r["id"]] = vistos.get(r["id"], 0) + 1
                  if r.get("status") in ("survived", "invalid", "timeout"):
                      ruins.append(r)

          faltando = [i for i in catalogo if i not in vistos]
          duplicados = sorted(i for i, n in vistos.items() if n > 1)
          estranhos = sorted(i for i in vistos if i not in catalogo)

          tabela = ["| M[id] | arquivo | status |", "|---|---|---|"]
          for r in sorted(resultados, key=lambda r: r["id"]):
              icone = {"killed": "✅", "survived": "❌", "invalid": "⚠️", "timeout": "⏱️"}
              tabela.append(f"| `{r['id']}` | `{r.get('file', '')}` | "
                            f"{icone.get(r.get('status'), '?')} {r.get('status')} |")
          corpo = ("### Prova de mutação\n\n"
                   f"- catálogo: **{len(catalogo)}** mutantes\n"
                   f"- executados: **{len(resultados)}**\n"
                   f"- mortos por asserção: **{sum(1 for r in resultados if r['status'] == 'killed')}**\n"
                   f"- cobertura: **{'COMPLETA' if not faltando and not duplicados else 'INCOMPLETA'}**\n\n"
                   + "\n".join(tabela) + "\n")

          resumo = os.environ.get("GITHUB_STEP_SUMMARY")
          if resumo:
              open(resumo, "a", encoding="utf-8").write(corpo)

          # comentário idempotente no PR (marcador fixo)
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          pr = os.environ.get("PR_NUMBER", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          if repo and pr and token:
              api = f"https://api.github.com/repos/{repo}/issues/{pr}/comments"
              pedido = urllib.request.Request(
                  api, headers={"Authorization": f"Bearer {token}",
                                "Accept": "application/vnd.github+json"})
              marca = "<!-- proof-report -->"
              existente = None
              try:
                  for c in json.load(urllib.request.urlopen(pedido, timeout=20)):
                      if marca in (c.get("body") or ""):
                          existente = c["id"]
                          break
              except Exception as exc:  # rede/API não pode mascarar a prova
                  print(f"::warning::não foi possível ler comentários: {exc}")
              dado = json.dumps({"body": marca + "\n" + corpo}).encode()
              alvo = f"{api}/{existente}" if existente else api
              metodo = "PATCH" if existente else "POST"
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      alvo, data=dado, method=metodo,
                      headers={"Authorization": f"Bearer {token}",
                               "Accept": "application/vnd.github+json",
                               "Content-Type": "application/json"}), timeout=20)
              except Exception as exc:
                  print(f"::warning::comentário não atualizado: {exc}")

          for r in ruins:
              print(f"::error file={r.get('file')}::" + r.get("id") + " " + r.get("status"))
          if faltando:
              print("::error file=" + f"{SK}/references/mutation-catalog.json::"
                    + "mutantes NÃO executados (fuga de validação): " + ", ".join(faltando))
          if duplicados:
              print("::error::mutantes executados mais de uma vez: " + ", ".join(duplicados))
          if estranhos:
              print("::error::ids fora do catálogo: " + ", ".join(estranhos))

          print(f"{len(resultados)} executados · {len(faltando)} faltando · "
                f"{len(ruins)} com defeito · catálogo {len(catalogo)}")
          ok = not faltando and not duplicados and not estranhos and not ruins
          sys.exit(0 if ok else 1)
          PY
