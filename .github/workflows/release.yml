name: Release CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write  # needed to create GitHub Release

jobs:
  build-release:
    name: Build wheel + GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-fsm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: pip install build twine pip-audit

      - name: Build wheel + sdist
        run: python -m build

      - name: Security audit (dependencies)
        run: pip-audit --strict --desc --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w

      - name: Run full test suite
        run: |
          pip install -e ".[dev]"
          pytest tests/unit tests/integration -v --tb=short

      - name: Safety guard smoke (S1)
        run: python -c "from audit_fsm.safety import assert_safe; assert_safe()"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --title "$TAG" \
            --draft \
            --notes "audit-fsm $TAG — see CHANGELOG for details."

  # No auto-publish to PyPI — manual gate.
  # To publish to PyPI, add a separate job with PYPI_API_TOKEN secret,
  # gated behind an environment with required reviewers.
