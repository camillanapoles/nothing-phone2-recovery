[project]
name = "audit-fsm"
version = "0.1.0"
description = "Safety-first FSM recovery audit for Nothing Phone 2 — objective-oriented storage, FastAPI CRUD, Pydantic AI V2 deterministic agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # S4 — FastAPI backend CRUD
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    # S8 — Deterministic agents (Pydantic AI V2, trending better than Instructor)
    "pydantic-ai>=2.59",
    # S3 — evidence hashing
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # FastAPI TestClient
    "ruff>=0.8",
]

[project.scripts]
audit-fsm = "audit_fsm.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
reportGeneralTypeIssues = "none"  # metaclass patterns confuse pyright; runtime tests verify correctness
